<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>⚛️ Tabela Química</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">⚛️ Tabela Química</div>
    <div class="subtitle">Arraste da barra esquerda — clique para detalhes — junte para reagir</div>
    <div style="flex:1"></div>
    <button id="themeToggle" class="btn ghost">Tema</button>
    <button id="exportBtn" class="btn">Exportar histórico</button>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-top">
        <input id="search" placeholder="Pesquisar nome ou símbolo..." />
        <button id="collapseBtn" class="btn ghost small">◀</button>
      </div>
      <div id="elementList" class="list" aria-live="polite"></div>
      <div class="sb-foot">Produced by: Genius</div>
    </aside>

    <main id="stage" class="stage" tabindex="0">
      <div id="grid" class="grid"></div>
    </main>
  </div>

  <canvas id="fxCanvas"></canvas>
  <div id="modalRoot" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
