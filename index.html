<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Periodic Pixel Combiner - Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Use the src stylesheet required by the drag/drop module -->
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
    <h1 style="margin:0;font-size:18px">Periodic Pixel Combiner</h1>
    <div style="flex:1"></div>
    <button id="themeToggle" class="btn ghost">Tema</button>
    <button id="soundToggle" class="btn ghost">Som</button>
    <button id="exportBtn" class="btn">Exportar</button>
  </header>

  <p>Drag elements from the palette into the main area. Move items to combine (2 H + 1 O → water; Fe + O → rusty iron).</p>

  <div id="palette" class="palette" aria-label="Element palette"></div>

  <div id="main" class="main" aria-label="Drop area">Drop elements here</div>

  <!-- load the drag/drop module (must be served over HTTP for modules to load) -->
  <script type="module" src="src/drag-drop.js" defer></script>
</body>
</html>
